# SpecBench v0 seed — 手作業で属性化した仕様スナップショット
#
# 重要: Phase 1 の seed は「合成（架空）商品」で構成する。ブランド・型番・機種名はすべて架空で、
#       GTIN/JAN は GS1 の店内用（restricted circulation）プレフィックス 20–29 を使い、実在商品と衝突しない。
#       実在メーカー仕様の取り込みは docs/SOURCES.md でライセンス判断が済んだソースのみ（現状なし）。
#
# 構造: families[].（ファミリー共通の既定値）→ products[].（バリアント／地域版ごとの差分で上書き）
#   attributes は属性単位でマージ、region_spec はキー単位でマージ、
#   compatibility / ingredients / bundle は商品側に書けば丸ごと置き換え。
#   数値は {value, unit}、範囲は {min, max, unit}、文字列は {value}。
seed_id: specbench-v0
source_id: S0-synthetic-seed
source_url_base: synthetic://specsure/seed/v0

