# 表記揺れ辞書（日英）。照合キー: NFKC → casefold → 空白・区切り除去。
# ここに無い語は「未認識」として扱い、成分の不在に基づく判定（S1）では推測せず UNKNOWN にする。
version: 1

brands:
  Kestrelon: [ケストレロン]
  Mizunagi: [ミズナギ, 水凪]
  Torrafen: [トラフェン]
  Sorameku: [ソラメク]
  Halvane: [ハルヴェイン]
  Pinewick: [パインウィック]
  Yukibana: [ユキバナ, 雪花]
  Brightquill: [ブライトクイル]
  Lumora: [ルモラ]
  Tidewell: [タイドウェル]
  Corvel: [コーベル]
  Ostrel: [オストレル]

# 「ブランドなし型番」の解決（verify._compat）で落とす機器種別の一般語
