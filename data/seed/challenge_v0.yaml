# このファイルは「語彙に無い言い回しの真の主張（expected PASS）」と「現実的な誤り（expected FAIL）」を手で書いたもの。
# 研究衛生のため、このセットの結果を見て verifier を調整しない（調整したら新しいチャレンジセットを作る）。
