# 仕様ソース台帳（機械可読）。docs/SOURCES.md はここから `python -m src.cli sources` で生成する。
# status:
#   allowed         … ライセンス／規約の判断済みで取り込み可
#   blocked         … 規約が不明確・再配布不可の可能性が高い等の理由で取り込まない
#   reference_only  … 参照は可だが「証拠ソース」としては使わない（第一者情報でない等）
#   prohibited      … 設計上、証拠ソースとして使ってはならない（レビュー・Q&A）
# 新しいソースは、ここに記録して status を判断してから取り込む。判断が付かないものは blocked。
version: 1

sources:
  - source_id: S0-synthetic-seed
    name: SpecSure 合成 seed（架空商品・手作業で属性化）
    kind: synthetic_manual
    evidence_role: first_party_spec    # 合成世界の「メーカー公式仕様」として扱う
    acquisition: 手作業で作成（data/seed/specbench_v0.yaml）。ネットワーク取得なし
    license: プロジェクト作成物（公開時は CC0-1.0 を想定、要最終判断）
    terms_note: 架空のブランド・型番・機種名のみ。GTIN は GS1 店内用プレフィックス 20–29 で実在商品と非衝突
    redistribution: "yes"
    status: allowed
    decided_by: claude (Phase 1 実装時、要 Yuta 確認)
    decided_at: "2026-10-31"

  - source_id: S1-test-fixtures
    name: テスト用極小 fixture
    kind: synthetic_manual
    evidence_role: first_party_spec
    acquisition: 手作業で作成（fixtures/）
    license: プロジェクト作成物
    terms_note: テスト専用。ベンチには含めない
    redistribution: "yes"
    status: allowed
    decided_by: claude (Phase 1 実装時、要 Yuta 確認)
    decided_at: "2026-10-31"

  - source_id: C1-manufacturer-spec-pages
    name: メーカー公式の仕様ページ・仕様表・取扱説明書 PDF（個別サイト）
    kind: manufacturer_official
    evidence_role: first_party_spec
    acquisition: 未実施（手作業での属性化を想定。大規模スクレイピングはしない）
    license: サイトごとに異なる（未確認）
    terms_note: 多くのサイトで転載・二次利用の条件が個別に定められており、サイト単位の規約確認が必要。事実データ（数値・互換機種）の属性化と本文の非保存を前提に、メーカーごとに判断する（Phase 2 で判断したメーカーは C1-<maker> として個別に記載）
    redistribution: unknown
    status: blocked
    decided_by: claude (Phase 1、メーカー単位のレビュー待ち)
    decided_at: "2026-10-31"

