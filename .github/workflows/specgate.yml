# SpecGate — 回帰ゲート。ローカルでは `python scripts/specgate.py` で同じ検査を実行できる。
# fail 条件: オフライン pytest の失敗、スプリット漏れ、challenge 再採点の BLOCK precision < 0.90 / S1 素通し > 0 /
#            UNKNOWN 率の baseline（configs/specgate_baseline.json）からの ±5pt 超の変動。
# 公開ツリーには未見 holdout（challenge v1）を含めないため、CI では v1 のリプレイはスキップとして記録される。
name: SpecGate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  specgate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: SpecGate (pytest + leak check + replay vs pinned baseline)
        env:
          SPECSURE_ALLOW_NETWORK: "0"
        run: python scripts/specgate.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specgate-report
          path: results/specgate.md
