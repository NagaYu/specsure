    evidence_role: first_party_spec
    acquisition: 公式ページを閲覧し手作業で属性化（型番・仕様・対応機種）。本文は保存しない
    license: サイト利用条件（著作権）
    terms_note: 著作物の複製等を事前許諾なしに禁止。ただし著作権法等で許可された範囲を除く
    redistribution: "no"
    status: allowed_internal
    decided_by: claude (provisional, 要 Yuta/法務確認)
    decided_at: "2026-10-31"
    terms_url: https://www.epson.jp/tou/
    rationale: 規約の対象は「本コンテンツ（著作物）」で、法令で許可された範囲を除外。型番・対応機種名などの事実情報の属性化には言及なし。データ収集の禁止条項なし

