# extractor v1 評価用のエージェント風回答 30 件（SYNTHETIC）
#
# - すべて Claude Code が手書きした合成文。実在の買い物エージェントの回答ではない。
# - 対象商品は SpecBench v0 の合成 seed（架空ブランド）。
# - 研究衛生: このファイル（回答文と人手ラベル）は extractor を実装する前にコミットした。
#
# claims（人手ラベル）: その文に明示的に書かれている検証可能な主張だけ。推測・比較・評判・ヘッジは主張にしない。
#   type: numeric | model | compatibility | ingredient | bundle | region | variant
#   polarity: affirm（既定）| deny
version: 1
synthetic: true
answers:
  - id: a01
    pid: jp-kc-pd65-bk
    text: このKC-PD65-BKは最大65Wで出力でき、重さは約112gです。USB PD 3.0とPPSに対応しているので、Nova 5 Proの急速充電にも使えます。
    claims:
      - {type: numeric, attribute: output_power, value: 65, unit: W}
      - {type: numeric, attribute: weight, value: 112, unit: g}
      - {type: compatibility, value: USB PD 3.0}
      - {type: compatibility, value: PPS}
      - {type: compatibility, value: Nova 5 Pro}
  - id: a02
    pid: us-kc-pd65-bk
    text: Yes — the KC-PD65 outputs up to 65 W and weighs 3.95 oz. It comes with a quick start guide, but the USB-C cable is sold separately.
    claims:
      - {type: numeric, attribute: output_power, value: 65, unit: W}
      - {type: numeric, attribute: weight, value: 3.95, unit: oz}
      - {type: bundle, value: quick start guide}
      - {type: bundle, value: USB-C cable, polarity: deny}
  - id: a03
    pid: jp-mz-ic80-bk
    text: MZ-IC80-BKはPX-810、PX-820、PX-830Fに対応しています。PX-710には対応していません。
    claims:
      - {type: compatibility, value: PX-810}
      - {type: compatibility, value: PX-820}
      - {type: compatibility, value: PX-830F}
      - {type: compatibility, value: PX-710, polarity: deny}
  - id: a04
    pid: jp-mz-ic70-bk
    text: This cartridge is compatible with the Mizunagi PX-700 and PX-710. It prints about 350 pages.
    claims:
      - {type: compatibility, value: Mizunagi PX-700}
      - {type: compatibility, value: PX-710}
      - {type: numeric, attribute: page_yield, value: 350, unit: pages}
  - id: a05
    pid: us-tr-lb-56wh
    text: The TR-LB-56WH is a 56Wh, 11.4V battery. It works with the Ostrel BookAir 14 (2024) and (2025), but it is not compatible with the BookPro 15.
    claims:
      - {type: numeric, attribute: capacity_energy, value: 56, unit: Wh}
      - {type: numeric, attribute: nominal_voltage, value: 11.4, unit: V}
      - {type: compatibility, value: Ostrel BookAir 14 (2024)}
      - {type: compatibility, value: Ostrel BookAir 14 (2025)}
      - {type: compatibility, value: BookPro 15, polarity: deny}
  - id: a06
    pid: jp-se-20-bk
    text: SE-20はBluetooth 5.3とLDACに対応し、イヤホン単体で約8時間再生できます。重さは片耳4.8gです。
    claims:
      - {type: compatibility, value: Bluetooth 5.3}
      - {type: compatibility, value: LDAC}
      - {type: numeric, attribute: battery_life, value: 8, unit: h}
      - {type: numeric, attribute: weight, value: 4.8, unit: g}
  - id: a07
    pid: jp-se-20-wh
    text: ホワイトモデルにも充電ケースとイヤーピース（S/M/L）が付属します。
    claims:
      - {type: bundle, value: 充電ケース}
      - {type: bundle, value: イヤーピース（S/M/L）}
  - id: a08
    pid: us-hv-n5-cl
    text: This clear case fits the Corvel Nova 5 only. It does not fit the Nova 5 Pro. It weighs 28 g and is 1.2 mm thick.
    claims:
      - {type: compatibility, value: Corvel Nova 5}
      - {type: compatibility, value: Nova 5 Pro, polarity: deny}
      - {type: numeric, attribute: weight, value: 28, unit: g}
      - {type: numeric, attribute: thickness, value: 1.2, unit: mm}
  - id: a09
    pid: jp-pw-h21-2m
    text: 長さ2mのケーブルで、最大48Gbpsの伝送に対応します。8K60や4K120にも対応しています。
    claims:
      - {type: numeric, attribute: length, value: 2, unit: m}
      - {type: numeric, attribute: max_data_rate, value: 48, unit: Gbps}
      - {type: compatibility, value: 8K60}
      - {type: compatibility, value: 4K120}
  - id: a10
    pid: jp-yk-hd12-w
    text: YK-HD12-Wは消費電力1200W、電圧はAC100Vです。速乾ノズルとセットノズルが付属しています。
